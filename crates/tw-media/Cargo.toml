[package]
name = "tw-media"
description = "Official Windows installation media: discovery, download, verification and cache"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time", "macros"] }
tracing.workspace = true
tw-core.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time"] }
