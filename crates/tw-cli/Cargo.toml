[package]
name = "tw-cli"
description = "terminal-windows command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "terminal-windows"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crossterm = "0.28"
dirs.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tw-core.workspace = true
tw-input.workspace = true
tw-mcp.workspace = true
tw-media.workspace = true
tw-qemu.workspace = true
tw-renderer.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The native window viewer exists on macOS and Windows only.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
winit = "0.30"
softbuffer = "0.4"
