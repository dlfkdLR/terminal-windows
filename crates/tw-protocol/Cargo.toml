[package]
name = "tw-protocol"
description = "Versioned, authenticated host<->guest agent protocol for terminal-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hex.workspace = true
hmac.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util", "time"] }
