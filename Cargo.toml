[workspace]
resolver = "2"
members = [
    "crates/tw-core",
    "crates/tw-input",
    "crates/tw-protocol",
    "crates/tw-qemu",
    "crates/tw-renderer",
    "crates/tw-mcp",
    "crates/tw-media",
    "crates/tw-cli",
    "guest/windows-agent",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/dlfkdLR/terminal-windows"

[workspace.dependencies]
tw-core = { path = "crates/tw-core" }
tw-protocol = { path = "crates/tw-protocol" }
tw-qemu = { path = "crates/tw-qemu" }
tw-input = { path = "crates/tw-input" }
tw-renderer = { path = "crates/tw-renderer" }
tw-mcp = { path = "crates/tw-mcp" }
tw-media = { path = "crates/tw-media" }
async-trait = "0.1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
hex = "0.4"
hmac = "0.12"
png = "0.17"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "time", "process", "fs", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Hot paths stay fast even in debug builds: hashing a 7.9 GiB ISO and
# encoding screenshots are unusably slow without optimization.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
